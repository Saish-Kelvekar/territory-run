services:
  db:
    image: postgis/postgis:16-3.4
    container_name: territory-db
    environment:
      POSTGRES_USER: territory
      POSTGRES_PASSWORD: territory_pw
      POSTGRES_DB: territory_run
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: